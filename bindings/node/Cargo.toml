[package]
name = "speechfoundry-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API bindings for the speechfoundry speech synthesis library"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
default = []
cuda = ["speechfoundry/cuda"]
metal = ["speechfoundry/metal"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json.workspace = true
speechfoundry = { path = "../../crates/speechfoundry" }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true

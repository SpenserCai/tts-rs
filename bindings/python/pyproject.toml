[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "candle-tts"
dynamic = ["version"]
description = "Modular native speech synthesis and voice conditioning with Rust and Candle"
requires-python = ">=3.10"
license = "MIT"
license-files = ["licenses/*"]
readme = "README.md"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/SpenserCai/tts-rs"

[tool.maturin]
python-source = "python"
module-name = "candle_tts._native"
bindings = "pyo3"

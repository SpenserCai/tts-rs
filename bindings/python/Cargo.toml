[package]
name = "tts-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the tts-rs speech synthesis library"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
cuda = ["tts-rs/cuda"]
metal = ["tts-rs/metal"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json.workspace = true
tts-rs = { package = "candle-tts", path = "../../crates/tts" }

[lints]
workspace = true

[package]
name = "speechfoundry-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the speechfoundry speech synthesis library"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
cuda = ["speechfoundry/cuda"]
metal = ["speechfoundry/metal"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json.workspace = true
speechfoundry = { path = "../../crates/speechfoundry" }

[lints]
workspace = true

[package]
name = "tts-cosyvoice"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Candle inference components for CosyVoice 3 speech synthesis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SpenserCai/tts-rs"

[features]
default = []
onnx = ["dep:ort"]
cuda = ["candle/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]

[dependencies]
candle = { package = "candle-core", version = "0.9.2" }
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"

[dev-dependencies]
tempfile = "3.15"

[lints]
workspace = true

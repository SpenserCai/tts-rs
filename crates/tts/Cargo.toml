[package]
name = "candle-tts"
description = "Modular local speech synthesis with Candle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["qwen", "cosyvoice"]
qwen = ["dep:tts-qwen"]
cosyvoice = ["dep:tts-cosyvoice", "tts-cosyvoice/onnx"]
cuda = ["candle-core/cuda", "tts-qwen?/cuda", "tts-cosyvoice?/cuda"]
metal = ["candle-core/metal", "tts-qwen?/metal", "tts-cosyvoice?/metal"]

[dependencies]
tts-core.workspace = true
tts-qwen = { workspace = true, optional = true }
tts-cosyvoice = { workspace = true, optional = true }
candle-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.15"

[lints]
workspace = true

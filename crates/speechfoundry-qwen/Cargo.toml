[package]
name = "speechfoundry-qwen"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Local Candle inference for Qwen3-TTS"
license = "MIT"
repository = "https://github.com/SpenserCai/tts-rs"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
flash-attn = ["cuda", "dep:candle-flash-attn"]

[dependencies]
speechfoundry-core.workspace = true
anyhow = "1.0"
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
candle-flash-attn = { version = "0.9.2", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
hound = "3.5"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
rayon = "1.10"
num-complex = "0.4"
half = "2.7"

[dev-dependencies]
approx = "0.5"
tempfile = "3.15"

[lints]
workspace = true
